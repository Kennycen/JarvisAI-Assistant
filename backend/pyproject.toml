[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis - a voice-first personal AI assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[google]>=1.8.2",
    "livekit-api>=1.2.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-api-python-client>=2.160",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "playwright>=1.49",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.3", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]